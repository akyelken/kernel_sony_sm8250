name: Inazuma Akyelken Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Env
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev libelf-dev flex bison git

      - name: Get Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Build Kernel (HARD FORCE)
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          
          # Hataları tamamen susturan ve yolları zorlayan komutlar
          make O=out ARCH=arm64 pdx203_defconfig
          
          # 'make -i' (ignore errors) ve 'KCFLAGS' ile her şeyi susturuyoruz
          make -i -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-w -Wno-error" \
            Image.gz || true

      - name: Check and Upload
        if: always()
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "DOSYA OLUŞTU!"
          else
            echo "Dosya hala yok, kaynak kodda büyük bir eksik var."
          fi
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Forced_Inazuma_Kernel
          path: out/arch/arm64/boot/Image.gz
