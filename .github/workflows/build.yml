name: Inazuma Akyelken Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev libelf-dev flex bison git python3

      - name: Get Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Build Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          
          # Sony Techpack'leri için gerekli olan yollar
          export KBUILD_EXTMOD="${GITHUB_WORKSPACE}/techpack/audio"
          
          make O=out ARCH=arm64 pdx203_defconfig
          
          # Hataları görmezden gel ve LLVM ile zorla
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-w" \
            Image.gz dtbo.img
