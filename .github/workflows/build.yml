name: Inazuma Akyelken Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup System
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev libelf-dev flex bison git python3

      - name: Get AOSP Clang
        run: |
          mkdir clang
          # Google'ın stabil Clang sürümünü çekiyoruz
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b1.tar.gz
          tar -C clang/ -xf clang-r416183b1.tar.gz

      - name: Build Kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Önce temizlik
          make ARCH=arm64 clean
          make ARCH=arm64 pdx203_defconfig
          
          # Derlemeye başla
          make -j$(nproc --all) \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-w" \
            Image.gz

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Inazuma-Kernel-Image
          path: arch/arm64/boot/Image.gz
