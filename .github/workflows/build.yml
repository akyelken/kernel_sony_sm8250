name: Inazuma Akyelken Build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup System
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev libelf-dev flex bison git python3

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Sony'nin lanetli Techpack değişkenlerini zorla tanıtıyoruz
          export CONFIG_SND_SOC_BENGAL=y
          export CONFIG_SND_SOC_LITO=y
          
          make O=out ARCH=arm64 pdx203_defconfig
          
          # Hata ne olursa olsun devam etmeye çalış ( -k parametresi eklendi )
          make -k -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-w" \
            Image.gz dtbo.img || true

      - name: Check Output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "BETON DÖKÜLDÜ!"
          else
            echo "Hala eksik bir şeyler var."
            exit 1
          fi
